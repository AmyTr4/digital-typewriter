<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Daily Roll</title>
    <link rel="icon" type="image/png" href="assets/heart.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div class="bg-sparkles" aria-hidden="true"></div>
    <div class="bg-charms" aria-hidden="true"></div>
    <main id="stage">
        <header class="intro">
            <h1>Daily Summary</h1>
        </header>

        <div class="printer-wrap">
            <img src="assets/printer.png" alt="printer" class="printer" />
            <div class="printer-text">₊✩‧₊˚print me₊✩‧₊˚</div>
            <div class="roller"></div>
        </div>
        <button id="printBtn" class="print-btn" type="button"></button>
        
        <article class="receipt" id="receipt">
            <span class="receipt-date" id="receiptDate"></span>
            <h2>My Silly Day</h2>
            <hr />
            <section class="receipt-section receipt-section-events">
                <h3>Events</h3>
                <ul class="events" id="eventsList">
                    
                </ul>
            </section>
            <hr />
            <section class="receipt-section receipt-section-todos">
                <h3>To do list</h3>
                <ul class="todos" id="todosList">
                    
                </ul>
            </section>
        </article>
    </main>
    
    <script src="elements.js" defer></script>
    <script src="data.js" defer></script>
    <script src="receipt.js" defer></script>
    <script src="printer.js" defer></script>
    <script src="background.js" defer></script>
    
</body>
</html>
